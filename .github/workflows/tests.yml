name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  mariadb:
    name: "MariaDB 11.7 / PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # ADR-0003 pins the Laravel floor but sets no PHP ceiling
        # (composer.json requires php: ^8.3) — cross both supported PHP
        # versions against both Laravel bounds so a PHP-version-specific
        # regression (e.g. in the vector grammar's parameter binding) can't
        # hide behind a single PHP version the way #1/#3 hid behind sqlite.
        php: ["8.3", "8.4"]
        laravel: [floor, latest]
    services:
      mariadb:
        # Pinned to an exact point release for reproducibility. Verified to
        # exist via the Docker Hub API before being used here — do not bump
        # without checking https://hub.docker.com/_/mariadb/tags first.
        image: mariadb:11.7.2
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: testing
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      RAG_TEST_MARIADB_HOST: 127.0.0.1
      RAG_TEST_MARIADB_PORT: 3306
      RAG_TEST_MARIADB_DATABASE: testing
      RAG_TEST_MARIADB_USERNAME: root
      RAG_TEST_MARIADB_PASSWORD: root
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo, pdo_mysql, pdo_sqlite, sqlite3
          coverage: none

      - name: Install dependencies (latest supported Laravel)
        if: matrix.laravel == 'latest'
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Pin to the ADR-0003 13.29 floor
        if: matrix.laravel == 'floor'
        # Exact version confirmed to resolve cleanly against this package's
        # other dependencies (laravel/ai, orchestra/testbench, pest) before
        # being committed here — see the Phase 5 report for how that was
        # verified. This is specifically the leg that catches a regression
        # like the one PR #61337 fixed: 13.27.0 (the version the vector
        # query builder API first merged in) compiles MariaDB's vector
        # distance expression without the required vec_fromtext(...)
        # wrapper, so the floor is pinned to 13.29.0 — the first release
        # containing that fix — not 13.27.0 (ADR-0003's whole reason for
        # pinning ^13.29 instead of ^13.0).
        run: |
          composer require "illuminate/database:13.29.0" "illuminate/support:13.29.0" "illuminate/queue:13.29.0" -W --no-interaction --no-progress

      - name: Wait for MariaDB
        run: |
          for i in $(seq 1 30); do
            mysqladmin ping -h 127.0.0.1 -uroot -proot --silent && break
            sleep 2
          done

      - name: Run tests
        run: vendor/bin/pest

      - name: Guard against the MariaDB acceptance suite silently skipping
        # A normal `pest` run reports success even if RAG_TEST_MARIADB_HOST
        # wiring breaks and every test in this directory falls through its
        # markTestSkipped() guard (see MariaDbAcceptanceTestCase) — this is
        # exactly how #1/#3 went unnoticed until someone read the run's test
        # count by hand. Re-running just this directory with
        # --fail-on-skipped turns that silent skip into a hard CI failure.
        run: vendor/bin/pest tests/Integration/MariaDb --fail-on-skipped

      - name: Pint
        run: vendor/bin/pint --test

      - name: PHPStan
        run: vendor/bin/phpstan analyse --no-progress

  postgres:
    name: "PostgreSQL+pgvector / PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # See the mariadb job's matrix comment — same rationale applies here.
        php: ["8.3", "8.4"]
        laravel: [floor, latest]
    services:
      postgres:
        # pgvector's official image, pinned to an exact pgvector+PG16
        # combination. Verified to exist via the Docker Hub API before being
        # used here — do not bump without checking
        # https://hub.docker.com/r/pgvector/pgvector/tags first.
        image: pgvector/pgvector:0.8.6-pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: testing
        ports:
          - 5432:5432
        options: >-
          --health-cmd=pg_isready
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      RAG_TEST_PGSQL_HOST: 127.0.0.1
      RAG_TEST_PGSQL_PORT: 5432
      RAG_TEST_PGSQL_DATABASE: testing
      RAG_TEST_PGSQL_USERNAME: postgres
      RAG_TEST_PGSQL_PASSWORD: postgres
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo, pdo_pgsql, pdo_sqlite, sqlite3
          coverage: none

      - name: Install dependencies (latest supported Laravel)
        if: matrix.laravel == 'latest'
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Pin to the ADR-0003 13.29 floor
        if: matrix.laravel == 'floor'
        run: |
          composer require "illuminate/database:13.29.0" "illuminate/support:13.29.0" "illuminate/queue:13.29.0" -W --no-interaction --no-progress

      - name: Enable pgvector on the test database
        run: |
          PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -d testing -c "CREATE EXTENSION IF NOT EXISTS vector;"

      - name: Run tests
        run: vendor/bin/pest

      - name: Guard against the pgvector acceptance suite silently skipping
        # Same guard as the mariadb job's — see that step's comment. Without
        # this, a broken RAG_TEST_PGSQL_HOST wiring makes every test in this
        # directory skip via PostgresAcceptanceTestCase's guard and CI still
        # goes green.
        run: vendor/bin/pest tests/Integration/Postgres --fail-on-skipped

      - name: Pint
        run: vendor/bin/pint --test

      - name: PHPStan
        run: vendor/bin/phpstan analyse --no-progress
